services:
  mongodb:
    image: mongo:8.2 ## !earlier versions seemed to crash
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      # Root admin user (used by mongo-express and initial DB setup)
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-adminpass}
      # Optional: create an initial database at first run
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-myapp}
    # volumes:
    #   - ./mongo_data:/data/db
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 })' -u $MONGO_INITDB_ROOT_USERNAME -p $MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-express:
    image: mongo-express:1.0.2-18
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "${ME_PORT:-8081}:8081"
    environment:
      # Admin username/password (same as mongo root credentials)
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-adminpass}

      # Connection target (use the internal service name on the same network)
      # Option 1: full connection string URL
      ME_CONFIG_MONGODB_URL: "mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-adminpass}@mongodb:27017/admin?authSource=admin"

      # Option 2: server/port (commented—use URL above for more control)
      # ME_CONFIG_MONGODB_SERVER: mongodb
      # ME_CONFIG_MONGODB_PORT: 27017

      # Optional UI settings
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_BASICAUTH_USERNAME:-}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_BASICAUTH_PASSWORD:-}
      ME_CONFIG_SITE_TITLE: ${ME_SITE_TITLE:-Mongo Express}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - test-network

# volumes:
#   mongo_data:

  npm-app:
    build: ./monolithic
    working_dir: /workspace
    volumes:
      - "./monolithic:/workspace"
      - "/workspace/node_modules"
    command: /bin/sh -c ./start.sh
    ports:
      - "8080:80"
    networks:
      - test-network

  pnpm-app:
    build: ./monorepo
    working_dir: /workspace
    volumes:
      - "./monorepo:/workspace"
      - "/workspace/node_modules"
      - "/workspace/.pnpm-store"
    command: pnpm dev
    #command: tail -f /dev/null
    ports:
      - "8088:5173"
      - "8089:8089"
    networks:
      - test-network
   

networks:
   test-network:


